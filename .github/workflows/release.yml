# Automated Release APK & AAB Packaging Pipeline
# Traces to: AG-SPEC-2026-V2, [REQ-VER-001], [REQ-VER-002], [NFR-PERF-001]

name: Android Release Automation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-package:
    name: Build & Sign Android Packages (APK / AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      - name: Audit Typographic Standards (Zero Em/En Dashes)
        run: |
          echo "Scanning for forbidden em dashes and en dashes..."
          if grep -rnP '[\x{2013}\x{2014}]' app/src/ build.gradle.kts settings.gradle.kts docs/ .github/; then
            echo "Error: Forbidden em dash or en dash detected!"
            exit 1
          fi
          echo "Typographic audit passed: 0 em/en dashes found."

      - name: Setup Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "Decoding release signing keystore..."
            echo "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > app/release.keystore
            chmod 600 app/release.keystore
            echo "RELEASE_KEYSTORE_PATH=${GITHUB_WORKSPACE}/app/release.keystore" >> $GITHUB_ENV
            echo "RELEASE_KEYSTORE_PASSWORD=${SECRET_KEYSTORE_PASSWORD}" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=${SECRET_KEY_ALIAS}" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=${SECRET_KEY_PASSWORD}" >> $GITHUB_ENV
          else
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "Error: RELEASE_KEYSTORE_BASE64 is mandatory for tagged releases to protect OTA signing lineage!" >&2
              exit 1
            fi
            echo "No release keystore secret provided. Generating hermetic CI signing keystore for dry-run dispatch..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias androgrid-ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass androgrid \
              -keypass androgrid \
              -dname "CN=AndroGrid CI, O=AndroGrid, C=US"
            chmod 600 app/release.keystore
            echo "RELEASE_KEYSTORE_PATH=${GITHUB_WORKSPACE}/app/release.keystore" >> $GITHUB_ENV
            echo "RELEASE_KEYSTORE_PASSWORD=androgrid" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=androgrid-ci" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=androgrid" >> $GITHUB_ENV
          fi

      - name: Build Release APK and AAB Packages
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Consolidate Artifacts & Generate SHA256SUMS.txt
        run: |
          VERSION="${GITHUB_REF_NAME:-latest}"
          mkdir -p dist

          # Copy generated APK
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "${APK_SRC}" ]; then
            cp "${APK_SRC}" "dist/androgrid-worker-${VERSION}.apk"
            cp "${APK_SRC}" "dist/androgrid-worker.apk"
            cp "${APK_SRC}" "dist/androgrid-worker-release.apk"
          else
            echo "Error: Release APK artifact not found!"
            exit 1
          fi

          # Enforce 25 MB release APK size bound (26,214,400 bytes)
          APK_SIZE=$(stat -c%s "dist/androgrid-worker.apk")
          MAX_APK_SIZE=$((25 * 1024 * 1024))
          if [ "${APK_SIZE}" -gt "${MAX_APK_SIZE}" ]; then
            echo "Error: Release APK size (${APK_SIZE} bytes) exceeds 25 MB limit (${MAX_APK_SIZE} bytes)!" >&2
            exit 1
          fi
          echo "Verified release APK size: ${APK_SIZE} bytes (limit: ${MAX_APK_SIZE} bytes)."

          # Copy generated AAB Bundle
          AAB_SRC=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -f "${AAB_SRC}" ]; then
            cp "${AAB_SRC}" "dist/androgrid-worker-${VERSION}.aab"
            cp "${AAB_SRC}" "dist/androgrid-worker.aab"
            cp "${AAB_SRC}" "dist/androgrid-worker-release.aab"
          else
            echo "Error: Release AAB artifact not found!"
            exit 1
          fi

          # Copy QR Code download assets
          if [ -f "docs/assets/download-qr.png" ]; then
            cp "docs/assets/download-qr.png" dist/
          fi
          if [ -f "docs/assets/download-qr.svg" ]; then
            cp "docs/assets/download-qr.svg" dist/
          fi

          # Extract Release Signing Certificate Fingerprints via environment variable
          if [ -n "${RELEASE_KEYSTORE_PATH}" ] && [ -f "${RELEASE_KEYSTORE_PATH}" ]; then
            echo "Extracting keystore certificate fingerprints..."
            keytool -list -v \
              -keystore "${RELEASE_KEYSTORE_PATH}" \
              -alias "${RELEASE_KEY_ALIAS}" \
              -storepass:env RELEASE_KEYSTORE_PASSWORD > dist/SIGNING_KEY_CERT.txt
          fi

          # Fail-closed APK signature verification
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "${APKSIGNER}" ] || [ ! -x "${APKSIGNER}" ]; then
            echo "Error: apksigner not found in ANDROID_HOME/build-tools!" >&2
            exit 1
          fi
          echo "Verifying APK signature and dumping certificate chain..."
          "${APKSIGNER}" verify --verbose --print-certs "dist/androgrid-worker.apk" > dist/APK_SIGNATURE_VERIFICATION.txt
          if [ ! -s "dist/APK_SIGNATURE_VERIFICATION.txt" ]; then
            echo "Error: APK signature verification produced empty output!" >&2
            exit 1
          fi

          # Generate cryptographic SHA-256 ledger
          cd dist
          sha256sum *.apk *.aab > SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload Artifacts as GitHub Actions Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: androgrid-android-release-packages
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME:-${GITHUB_SHA}}"
          echo "Publishing Android release for version: ${VERSION}"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists. Uploading additional assets..."
            gh release upload "${VERSION}" dist/* --clobber
          else
            gh release create "${VERSION}" dist/* \
              --title "Release ${VERSION}" \
              --notes "Production release APK and AAB packages for AndroGrid mobile worker client. Verified under [REQ-VER-001], [REQ-VER-002], and [NFR-PERF-001]."
          fi
